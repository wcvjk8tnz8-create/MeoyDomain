<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meoy · 二级域名分发</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="bg"></div>

<div class="wrap narrow" style="padding-top:60px">
  <div class="brand-line">
    <img id="brandLogo" src="/img/logo.jpg" alt="Meoy" class="brand-logo">
    <div>
      <div class="brand-name" data-site-name>Meoy</div>
      <div class="brand-sub">二级域名分发 · DNS 管理</div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin">登录</button>
      <button class="tab" id="tabReg">注册</button>
    </div>

    <div id="paneLogin">
      <div class="field">
        <label>邮箱</label>
        <input id="lEmail" type="email" placeholder="you@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="lPass" type="password" placeholder="登录密码" autocomplete="current-password">
      </div>
      <button class="btn primary" id="btnLogin" style="width:100%;justify-content:center">登录</button>
    </div>

    <div id="paneReg" class="hidden">
      <div class="field">
        <label>邮箱</label>
        <input id="rEmail" type="email" placeholder="yourname@gmail.com" autocomplete="username">
        <div class="hint" id="mailHint">仅支持 Gmail / QQ 邮箱</div>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="rPass" type="password" placeholder="至少 8 位" autocomplete="new-password">
        <div class="hint">无需邮箱验证，注册后直接登录。</div>
      </div>
      <div class="alert warn" style="margin-bottom:10px" id="ipRule">
        同一网络最多注册 2 个账号，超限账号一经发现将被全部封禁。
      </div>
      <label class="check" style="margin-bottom:12px">
        <input type="checkbox" id="rAgree">
        <span id="agreeLabel">我已阅读并同意《服务条款与免责声明》，了解并接受禁止滥用与免责条款</span>
      </label>
      <button class="btn primary" id="btnReg" style="width:100%;justify-content:center">注册并登录</button>
    </div>
  </div>

  <div class="card flat">
    <div class="row between" style="margin-bottom:10px">
      <h3 style="margin:0">说明</h3>
      <span id="bgsw"></span>
    </div>
    <div style="color:var(--text-2);font-size:12.5px;line-height:1.9">
      注册后可申请根域名下的二级子域名，配额由管理员配置。<br>
      申请提交后需管理员审核，通过后自行添加 DNS 记录。<br>
      支持 A、AAAA、CNAME、MX、TXT、NS、SRV、CAA、NAPTR、DS 等类型。
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/api.js"></script>
<script>
document.getElementById('bgsw').innerHTML = wallpaperSwitchHtml();

const tabLogin = document.getElementById('tabLogin'), tabReg = document.getElementById('tabReg');
const paneLogin = document.getElementById('paneLogin'), paneReg = document.getElementById('paneReg');
tabLogin.onclick = () => { tabLogin.classList.add('active'); tabReg.classList.remove('active'); paneLogin.classList.remove('hidden'); paneReg.classList.add('hidden'); };
tabReg.onclick = () => { tabReg.classList.add('active'); tabLogin.classList.remove('active'); paneReg.classList.remove('hidden'); paneLogin.classList.add('hidden'); };

document.getElementById('btnLogin').onclick = async () => {
  const email = document.getElementById('lEmail').value.trim();
  const password = document.getElementById('lPass').value;
  if (!email || !password) return toast('请输入邮箱和密码', 'err');
  try {
    const d = await api.post('/api/auth/login', { email, password });
    toast('登录成功' + (d.user.role === 'admin' ? '，管理员（不限配额）' : ''));
    setTimeout(() => location.href = '/dashboard', 400);
  } catch (e) { toast(e.message, 'err'); }
};

document.getElementById('btnReg').onclick = async () => {
  const email = document.getElementById('rEmail').value.trim();
  const password = document.getElementById('rPass').value;
  if (!email || !password) return toast('请输入邮箱和密码', 'err');
  if (password.length < 8) return toast('密码至少 8 位', 'err');
  if (!document.getElementById('rAgree').checked) return toast('请先勾选同意《服务条款与免责声明》', 'err');
  try {
    const d = await api.post('/api/auth/register', { email, password, agreeTerms: true });
    toast(d.isFirstAdmin ? '注册成功，已设为管理员（不限配额）' : '注册成功');
    setTimeout(() => location.href = '/dashboard', 400);
  } catch (e) { toast(e.message, 'err'); }
};

// 规则摘要（邮箱白名单 + 单 IP 账号上限）
api.get('/api/rules').then((r) => {
  const names = r.allowedEmailDomains.map((d) => d.split('.')[0]);
  document.getElementById('mailHint').textContent =
    `仅支持 ${names.join(' / ')} 邮箱，其它域名无法注册`;
  document.getElementById('ipRule').textContent =
    `同一网络最多注册 ${r.maxAccountsPerIp} 个账号，超限账号一经发现将被全部封禁。`;
  document.getElementById('agreeLabel').innerHTML =
    `我已阅读并同意<a href="/terms.html" target="_blank">《服务条款与免责声明》</a>，了解并接受禁止滥用与免责条款`;
}).catch(() => {});

loadBranding().then((b) => {
  applyBranding(b);
  document.getElementById('brandLogo').src = b.logoUrl;
});

api.get('/api/auth/me').then(() => { location.href = '/dashboard'; }).catch(() => {});
</script>
</body>
</html>
